<!doctype html>
<html lang="it" data-theme="neve">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forma — Prototipo design</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<aside class="stage-side">
  <div>
    <h1>For<span>ma</span></h1>
    <p style="margin-top:14px">Allenamento e alimentazione in un’unica app. Prototipo navigabile in stile Neve, chiaro e scuro. Tocca la barra in basso, spunta le serie, scegli l’accento.</p>
  </div>
  <div>
    <div class="group-label">Tema</div>
    <div class="chips" id="variants" role="group" aria-label="Tema">
      <button class="chip" data-v="neve" aria-pressed="true">Chiaro</button>
      <button class="chip" data-v="neve-scura" aria-pressed="false">Scuro</button>
    </div>
  </div>
  <div>
    <div class="group-label">Piattaforma</div>
    <div class="chips" id="platforms" role="group" aria-label="Piattaforma">
      <button class="chip" data-plat="ios">iOS 26</button>
      <button class="chip" data-plat="android">Android</button>
      <button class="chip" data-plat="both">Affianca</button>
    </div>
    <p class="stage-note" id="plat-note" style="margin-top:10px"></p>
  </div>
  <div>
    <div class="group-label">Schermate principali</div>
    <div class="chips" role="group" aria-label="Schermate principali">
      <button class="chip" data-s="oggi" aria-pressed="true">Oggi</button>
      <button class="chip" data-s="allenamento">Allenamento</button>
      <button class="chip" data-s="pasti">Pasti</button>
      <button class="chip" data-s="stats">Statistiche</button>
      <button class="chip" data-s="impostazioni">Impostazioni</button>
    </div>
  </div>
  <div>
    <div class="group-label">Primo avvio</div>
    <div class="chips" role="group" aria-label="Primo avvio">
      <button class="chip" data-s="onb">Onboarding 1</button>
      <button class="chip" data-s="onb2">2</button>
      <button class="chip" data-s="onb3">3</button>
      <button class="chip" data-s="onb4">4</button>
      <button class="chip" data-s="oggi-vuoto">Oggi vuoto</button>
    </div>
  </div>
  <div>
    <div class="group-label">Allenamento</div>
    <div class="chips" role="group" aria-label="Allenamento">
      <button class="chip" data-s="sessione">Sessione</button>
      <button class="chip" data-s="riepilogo">Riepilogo</button>
      <button class="chip" data-s="programma">Programma</button>
      <button class="chip" data-s="esercizio">Esercizio</button>
      <button class="chip" data-s="esercizi">Catalogo</button>
      <button class="chip" data-s="crea-esercizio">Crea esercizio</button>
      <button class="chip" data-s="muscoli">Mappa muscolare</button>
    </div>
  </div>
  <div>
    <div class="group-label">Pasti</div>
    <div class="chips" role="group" aria-label="Pasti">
      <button class="chip" data-s="cerca">Ricerca</button>
      <button class="chip" data-s="cibo">Scheda alimento</button>
      <button class="chip" data-s="versioni">Versioni</button>
      <button class="chip" data-s="crea-alimento">Crea alimento</button>
      <button class="chip" data-s="scan">Barcode</button>
      <button class="chip" data-s="ricette">Ricette</button>
      <button class="chip" data-s="pasti-config">Pasti configurabili</button>
    </div>
  </div>
  <div>
    <div class="group-label">Altro</div>
    <div class="chips" role="group" aria-label="Altro">
      <button class="chip" data-s="peso">Peso</button>
      <button class="chip" data-s="obiettivi">Obiettivi</button>
      <button class="chip" data-s="promemoria">Promemoria</button>
      <button class="chip" data-s="dati">Dati</button>
    </div>
  </div>
  <div>
    <div class="group-label">Ricerca alimenti: stati</div>
    <div class="chips" id="search-states" role="group" aria-label="Stati della ricerca">
      <button class="chip" data-ss="vuoto">Vuota</button>
      <button class="chip" data-ss="risultati">Risultati</button>
      <button class="chip" data-ss="nessuno">Nessun risultato</button>
      <button class="chip" data-ss="caricamento">Caricamento</button>
      <button class="chip" data-ss="offline">Offline</button>
    </div>
  </div>
  <p class="stage-note" id="note"></p>
</aside>

<main class="stage-phone">
  <div class="phone" id="phone-main">
    <div class="screen" id="screen">
      <div class="statusbar" id="statusbar"></div>
      <div class="pages" id="pages"></div>
      <nav class="nav glass" id="nav" aria-label="Sezioni"></nav>
      <i class="home-ind" aria-hidden="true"></i>
    </div>
  </div>
  <iframe class="twin" id="twin" title="Anteprima Android" hidden></iframe>
</main>

<script src="sample-foods.js"></script>
<script src="screens-extra.js"></script>
<script src="app.js"></script>
<script src="tweaks.js"></script>
</body>
</html>
